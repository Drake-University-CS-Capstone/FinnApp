name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "whoami"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd /home/ec2-user/FinnApp
            git fetch origin
            git reset --hard origin/main

            cd /home/ec2-user/FinnApp/backend
            /home/ec2-user/FinnApp/backend/.venv/bin/pip install -r requirements.txt
            sudo systemctl restart finn-backend

            cd /home/ec2-user/FinnApp/frontend
            npm install
            npm run build
            sudo systemctl restart finn-frontend

            sudo systemctl restart nginx
          EOF